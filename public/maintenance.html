<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Site Under Maintenance</title>
		<meta
			name="description"
			content="This site is currently down for scheduled maintenance." />
		<style>
			:root {
				--bg: #0b1020;
				--panel: rgba(17, 24, 39, 0.78);
				--border: rgba(255, 255, 255, 0.12);
				--text: #f3f4f6;
				--muted: #a1a1aa;
				--accent: #7dd3fc;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
				font-family: Arial, Helvetica, sans-serif;
				background: radial-gradient(
					circle at top,
					#111827 0%,
					var(--bg) 45%,
					#050816 100%
				);
				color: var(--text);
			}

			body {
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
			}

			.card {
				width: min(100%, 720px);
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 20px;
				padding: clamp(32px, 6vw, 64px);
				box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
				text-align: center;
			}

			.badge {
				display: inline-block;
				padding: 8px 14px;
				border: 1px solid rgba(125, 211, 252, 0.4);
				background: rgba(125, 211, 252, 0.08);
				border-radius: 999px;
				color: var(--accent);
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}

			h1 {
				margin: 24px 0 16px;
				font-size: clamp(2.2rem, 6vw, 4.5rem);
				line-height: 1.05;
				letter-spacing: -0.06em;
			}

			p {
				margin: 0 auto;
				max-width: 540px;
				font-size: 1.05rem;
				line-height: 1.7;
				color: var(--muted);
			}

			.dot {
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<main
			class="card"
			aria-live="polite">
			<div class="badge">Maintenance</div>
			<h1>I’ll be right back<span class="dot">.</span></h1>
			<p>
				This site is currently down for maintenance. I'm making updates and will
				be back online shortly.
			</p>
		</main>
	</body>
</html>
