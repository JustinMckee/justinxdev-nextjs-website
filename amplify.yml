version: 1
frontend:
  phases:
    preBuild:
      commands:
        - 'npx pnpm install --config.only-built-dependencies=@parcel/watcher,sharp,unrs-resolver'
    build:
      commands:
        - 'npx pnpm run build'
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - '.next/cache/**/*'
      - 'node_modules/**/*'
