version: 1
frontend:
  phases:
    preBuild:
      commands:
        - 'npx pnpm config set only-built-dependencies @parcel/watcher sharp unrs-resolver'
        - 'npx pnpm config set strict-dep-builds false'
        - 'npx pnpm install'
    build:
      commands:
        - 'npx pnpm run build'
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - '.next/cache/**/*'
      - 'node_modules/**/*'
